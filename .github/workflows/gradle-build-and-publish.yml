name: Gradle build and publish

on:
  workflow_call:
    inputs:
      release_type: { required: false, type: string, default: '' }
      java_version: { required: false, type: string, default: '25' }
      java_distribution: { required: false, type: string, default: temurin }
      build_command: { required: false, type: string, default: build }
      build_args: { required: false, type: string }
      integration_test_task: { required: false, type: string }
      publish_package: { required: false, type: string, default: 'false' }
      override_version: { required: false, type: string }
      override_tagged_branch: { required: false, type: string, default: main }
      junit_results: { required: false, type: string, default: 'true' }
      junit_results_path: { required: false, type: string, default: build/test-results }
      junit_report: { required: false, type: string, default: 'true' }
      junit_report_path: { required: false, type: string, default: build/reports/tests }
      checkstyle_report: { required: false, type: string, default: 'true' }
      checkstyle_report_path: { required: false, type: string, default: build/reports/checkstyle }
      jacoco_coverage_report: { required: false, type: string, default: 'true' }
      jacoco_coverage_report_path: { required: false, type: string, default: build/reports/jacoco }
      github_bot_username: { required: false, type: string, default: github-actions-bot }
      semgrep_check: { required: false, type: string, default: 'false' }
      create_tag:
        description: 'DEPRECATED: use release_type=patch/minor/major instead.'
        required: false
        type: string
        default: 'false'
      is_snapshot:
        description: 'DEPRECATED: use release_type=snapshot instead.'
        required: false
        type: string
        default: 'false'
    secrets:
      gh_token: { required: true }
      aws_region: { required: false }
      github_app_id: { required: false }
      github_app_private_key: { required: false }
      github_app_organisation: { required: false }
      sonatype_username: { required: false }
      sonatype_password: { required: false }
      gpg_signing_key: { required: false }
      gpg_passphrase: { required: false }
    outputs:
      published_artifact_version:
        description: The version of the published artifact
        value: ${{ jobs.modern.outputs.published_artifact_version || jobs.legacy.outputs.published_artifact_version }}

permissions:
  contents: write
  packages: write

jobs:
  deprecation-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Transitional workflow notice
        run: |
          echo "::warning title=Transitional workflow::laa-ccms-common-workflows is a compatibility shim. Migrate to laa-reusable-github-actions/.github/workflows/java-gradle-build-and-publish.yml; no fixed sunset date has been set."
          echo "## ⚠️ Transitional workflow" >> "$GITHUB_STEP_SUMMARY"
          echo "Migrate to the central \`java-gradle-build-and-publish.yml\` workflow. No fixed sunset date has been set." >> "$GITHUB_STEP_SUMMARY"

  modern:
    needs: deprecation-notice
    if: ${{ inputs.create_tag != 'true' && inputs.is_snapshot != 'true' && inputs.publish_package != 'true' }}
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/java-gradle-build-and-publish.yml@262cfada3caf0af6c7b86805f5d47c683d0e45da # feat/java-pipeline-refactor 2026-07-23
    with:
      release_type: ${{ inputs.release_type }}
      java_version: ${{ inputs.java_version }}
      java_distribution: ${{ inputs.java_distribution }}
      build_command: ${{ inputs.build_command }}
      build_args: ${{ inputs.build_args }}
      integration_test_task: ${{ inputs.integration_test_task }}
      override_version: ${{ inputs.override_version }}
      junit_results: ${{ inputs.junit_results == 'true' }}
      junit_results_path: ${{ inputs.junit_results_path }}
      junit_report: ${{ inputs.junit_report == 'true' }}
      junit_report_path: ${{ inputs.junit_report_path }}
      checkstyle_report: ${{ inputs.checkstyle_report == 'true' }}
      checkstyle_report_path: ${{ inputs.checkstyle_report_path }}
      jacoco_coverage_report: ${{ inputs.jacoco_coverage_report == 'true' }}
      jacoco_coverage_report_path: ${{ inputs.jacoco_coverage_report_path }}
      github_bot_username: ${{ inputs.github_bot_username }}
      semgrep_check: ${{ inputs.semgrep_check == 'true' }}
    secrets:
      gh_token: ${{ secrets.gh_token }}
      aws_region: ${{ secrets.aws_region }}
      sonatype_username: ${{ secrets.sonatype_username }}
      sonatype_password: ${{ secrets.sonatype_password }}
      gpg_signing_key: ${{ secrets.gpg_signing_key }}
      gpg_passphrase: ${{ secrets.gpg_passphrase }}

  legacy:
    needs: deprecation-notice
    if: ${{ inputs.create_tag == 'true' || inputs.is_snapshot == 'true' || inputs.publish_package == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      published_artifact_version: ${{ steps.capture.outputs.published_artifact_version }}
    env:
      GITHUB_TOKEN: ${{ secrets.gh_token }}
      AWS_REGION: ${{ secrets.aws_region }}
      GITHUB_APP_ID: ${{ secrets.github_app_id }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.github_app_private_key }}
      SONATYPE_USERNAME: ${{ secrets.sonatype_username }}
      SONATYPE_PASSWORD: ${{ secrets.sonatype_password }}
      GPG_SIGNING_KEY: ${{ secrets.gpg_signing_key }}
      GPG_PASSPHRASE: ${{ secrets.gpg_passphrase }}
    steps:
      - name: Warn about deprecated inputs
        run: |
          echo "::warning::This run uses deprecated CCMS publishing inputs. Migrate to release_type before adopting the central Java workflow."

      - name: Get GitHub App token
        if: ${{ env.GITHUB_APP_ID != '' && env.GITHUB_APP_PRIVATE_KEY != '' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.github_app_id }}
          private-key: ${{ secrets.github_app_private_key }}
          owner: ${{ secrets.github_app_organisation }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.create_tag == 'true' && inputs.override_tagged_branch || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token || secrets.gh_token }}

      - name: Run Semgrep scan
        if: ${{ inputs.semgrep_check == 'true' }}
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/semgrep-scan@262cfada3caf0af6c7b86805f5d47c683d0e45da # feat/java-pipeline-refactor 2026-07-23

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build and test
        env:
          BUILD_ARGS: ${{ inputs.build_args }}
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          args=()
          if [[ -n "$BUILD_ARGS" ]]; then read -r -a args <<< "$BUILD_ARGS"; fi
          ./gradlew "$BUILD_COMMAND" "${args[@]}"

      - name: Test coverage verification
        if: ${{ inputs.jacoco_coverage_report == 'true' }}
        run: ./gradlew jacocoTestCoverageVerification

      - name: Configure Testcontainers Docker API compatibility
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: Integration test
        if: ${{ inputs.integration_test_task != '' }}
        run: ./gradlew "${{ inputs.integration_test_task }}"

      - name: Publish snapshot package
        if: ${{ inputs.publish_package == 'true' && inputs.create_tag != 'true' && inputs.is_snapshot == 'true' }}
        run: ./gradlew updateSnapshotVersion && ./gradlew publish

      - name: Publish package
        if: ${{ inputs.publish_package == 'true' && inputs.create_tag != 'true' && inputs.is_snapshot != 'true' }}
        env:
          OVERRIDE_VERSION: ${{ inputs.override_version }}
        run: |
          args=()
          if [[ -n "$OVERRIDE_VERSION" ]]; then args+=(-Pversion="$OVERRIDE_VERSION"); fi
          ./gradlew publish "${args[@]}"

      - name: Create tag with legacy Gradle release plugin
        if: ${{ inputs.create_tag == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.gh_token }}
        run: |
          git config --global user.email "${{ inputs.github_bot_username }}[bot]@users.noreply.github.com"
          git config --global user.name "${{ inputs.github_bot_username }}[bot]"
          ./gradlew release -Prelease.useAutomaticVersion=true

      - name: Capture published version
        id: capture
        env:
          OVERRIDE_VERSION: ${{ inputs.override_version }}
        run: |
          version="$OVERRIDE_VERSION"
          if [[ -z "$version" ]]; then version=$(grep '^version=' gradle.properties | cut -d= -f2); fi
          echo "published_artifact_version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload test results
        if: ${{ inputs.junit_results == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: ${{ inputs.junit_results_path }}
          retention-days: 14

      - name: Upload test report
        if: ${{ inputs.junit_report == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report
          path: ${{ inputs.junit_report_path }}
          retention-days: 14

      - name: Upload Checkstyle report
        if: ${{ inputs.checkstyle_report == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkstyle-report
          path: ${{ inputs.checkstyle_report_path }}
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: ${{ inputs.jacoco_coverage_report == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-coverage-report
          path: ${{ inputs.jacoco_coverage_report_path }}
          retention-days: 14
