name: Publish image to ECR

on:
  workflow_call:
    inputs:
      java_version: { required: false, type: string, default: '25' }
      java_distribution: { required: false, type: string, default: temurin }
      image_version: { required: true, type: string }
      dockerfile_path: { required: false, type: string }
      docker_build_args: { required: false, type: string }
      jar_subproject: { required: false, type: string }
      image_scan: { required: false, type: string, default: 'true' }
      image_scan_severity: { required: false, type: string, default: medium }
      image_scan_fail_on: { required: false, type: string, default: upgradable }
      image_scan_policy_path: { required: false, type: string, default: .snyk }
      image_scan_upload_sarif: { required: false, type: string, default: 'true' }
      publish: { required: false, type: string, default: 'true' }
      tag_with_latest: { required: false, type: boolean, default: false }
    secrets:
      gh_token: { required: true }
      ecr_region: { required: true }
      ecr_repository: { required: true }
      ecr_role_to_assume: { required: true }
      ecr_registry: { required: false }
      snyk_token: { required: false }
      snyk_client_id: { required: false }
      snyk_client_secret: { required: false }
      root_certificate: { required: false }
      binding_directory: { required: false }
      tls_keystore_password: { required: false }
    outputs:
      published_image_version:
        description: The version of the published image
        value: ${{ jobs.publish-image.outputs.published_image_version }}

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  deprecation-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Transitional workflow notice
        run: |
          echo "::warning title=Transitional workflow::laa-ccms-common-workflows is a compatibility shim. Migrate to laa-reusable-github-actions/.github/workflows/java-ecr-publish-image.yml; no fixed sunset date has been set."
          echo "## ⚠️ Transitional workflow" >> "$GITHUB_STEP_SUMMARY"
          echo "Migrate to the central \`java-ecr-publish-image.yml\` workflow. No fixed sunset date has been set." >> "$GITHUB_STEP_SUMMARY"

  publish-image:
    needs: deprecation-notice
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/java-ecr-publish-image.yml@262cfada3caf0af6c7b86805f5d47c683d0e45da # feat/java-pipeline-refactor 2026-07-23
    with:
      java_version: ${{ inputs.java_version }}
      java_distribution: ${{ inputs.java_distribution }}
      image_version: ${{ inputs.image_version }}
      dockerfile_path: ${{ inputs.dockerfile_path }}
      docker_build_args: ${{ inputs.docker_build_args }}
      jar_subproject: ${{ inputs.jar_subproject }}
      image_scan: ${{ inputs.image_scan == 'true' }}
      image_scan_severity: ${{ inputs.image_scan_severity }}
      image_scan_fail_on: ${{ inputs.image_scan_fail_on }}
      image_scan_policy_path: ${{ inputs.image_scan_policy_path }}
      image_scan_upload_sarif: ${{ inputs.image_scan_upload_sarif == 'true' }}
      publish: ${{ inputs.publish == 'true' }}
      tag_with_latest: ${{ inputs.tag_with_latest }}
    secrets:
      ecr_region: ${{ secrets.ecr_region }}
      ecr_repository: ${{ secrets.ecr_repository }}
      ecr_role_to_assume: ${{ secrets.ecr_role_to_assume }}
      ecr_registry: ${{ secrets.ecr_registry }}
      snyk_token: ${{ secrets.snyk_token }}
      snyk_client_id: ${{ secrets.snyk_client_id }}
      snyk_client_secret: ${{ secrets.snyk_client_secret }}
      root_certificate: ${{ secrets.root_certificate }}
      binding_directory: ${{ secrets.binding_directory }}
      tls_keystore_password: ${{ secrets.tls_keystore_password }}
