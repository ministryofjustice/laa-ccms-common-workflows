name: Harden Java image
description: Remove roots identified by the OpenJDK eMudhra guidance from JVM and container CA stores and optionally enable revocation checks

inputs:
  image:
    description: The local image name and tag to harden
    required: true
  block_compromised_certificates:
    description: Remove the four root certificates from JVM truststores and container CA bundles
    required: false
    default: 'true'
  enable_revocation:
    description: Enable CRL distribution point and OCSP checks for JVM TLS connections
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Harden JVM certificate validation
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        BLOCK_COMPROMISED_CERTIFICATES: ${{ inputs.block_compromised_certificates }}
        ENABLE_REVOCATION: ${{ inputs.enable_revocation }}
      run: "${GITHUB_ACTION_PATH}/harden-java-image.sh"
